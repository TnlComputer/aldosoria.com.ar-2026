; Limites de PHP para el sitio (cPanel / PHP-FPM lee este archivo de public_html)
; Permite subir los archivos de los cursos desde el panel de administracion.
upload_max_filesize = 256M
post_max_size = 260M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Nunca mostrar errores ni la version de PHP a los visitantes
display_errors = Off
expose_php = Off
